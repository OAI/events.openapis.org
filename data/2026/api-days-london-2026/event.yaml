talks:
  - slug: api-days-london-2026-welcome-openapi-age-of-ai
    title: OpenAPI Track Welcome
    time: 9:30am–9:35am
    category: OpenAPI Track
    speakers:
      - erik-wilde
    description: >-
      OpenAPI has seen a lot of success since it was created as Swagger in 2010
      and became OpenAPI in 2016. What is the reason for its continued momentum
      and how does the landscape change with AI entering the picture in a variety
      of ways? We look at how OpenAPI can help you, how OAI can help you using
      OpenAPI better, and how AI means that you have to slightly adjust the way
      you design and manage your APIs.
  - slug: api-days-london-2026-workflows-ai-agents-execute
    title: 'Beyond OpenAPI: API Workflows That AI Agents Can Actually Execute'
    time: 9:35am–9:55am
    category: OpenAPI Track
    speakers:
      - frank-kilcommins
    description: >-
      AI agents can call individual API endpoints, but multi-step workflows?
      That's where they struggle. OpenAPI describes what each endpoint does, but
      not how to orchestrate them into business processes. Agents are left to
      infer sequencing, handle conditional logic, and manage state across
      calls—burning tokens and producing unpredictable results. The Arazzo
      Specification solves this by providing machine-readable workflow
      descriptions that agents can execute directly. And Arazzo 1.1 takes it
      further, extending support from OpenAPI-based REST services to
      AsyncAPI-defined event systems, enabling true workflow orchestration across
      synchronous and asynchronous boundaries. This talk explores what's new in
      Arazzo 1.1: AsyncAPI support for event-driven workflows, enhanced selector
      support using JSONPath and XPath for precise data extraction, and chained
      workflow composition for reusable process libraries. These capabilities
      transform how agents interact with APIs—from inferring workflows to
      executing defined processes. Whether you're building automation across
      distributed systems, exposing use-case-oriented capabilities to AI agents,
      or designing MCP servers with governed capability access, Arazzo 1.1
      provides the declarative fabric for predictable, testable, agent-executable
      workflows. If OpenAPI tells agents what they can call, Arazzo tells them
      what they should do—and how to do it reliably.
  - slug: api-days-london-2026-openapi-extensions-map
    title: OpenAPI Extensions Are Not a Mess, They Are a Map
    time: 9:55am–10:20am
    category: OpenAPI Track
    speakers:
      - kin-lane
    description: >-
      Five years ago I looked at about fifty OpenAPI extensions from fourteen
      providers and concluded that providers were quietly bending OpenAPI to carry
      operational details the specification was never designed to hold. This year
      I pointed a much bigger lens at the same question using my APIs.io search
      engine — every OpenAPI in my catalog, 15,722 documents from 7,012 providers
      I found 1,637 distinct 'x-' extensions. delivering on a variety of
      operational concerns. Some you would guess: SDK generation, documentation,
      mocking and testing. Others are there because the specification has no word
      for them at all — provenance (where did this document come from), visibility
      (who is allowed to see this operation), capability declaration (what can
      this endpoint actually do), change management, monetization (what does a
      call cost), legal, privacy. Not one of those is a fringe concern, and not
      one of them has a home. The biggest job by far is saying something about
      data that OpenAPI and JSON Schema could not, and inside it sit nine more
      distinct problems, from type systems to identity and relationships to units
      and formatting. A regulator needing to say 'this is a CDS PositiveInteger',
      a payments company needing to say 'this is money', and a date library all
      hit the same wall separately and each invented their own way through it.
      Like most of my work with API, I do not see this as a mess we should clean
      this up. Extensions are why OpenAPI has survived contact with reality. It is
      that eighteen distinct jobs is not a specification gap you patch — it is the
      wrong container. Almost none of what these extensions carry is the API
      contract. It is operational metadata about the contract, and it belongs
      alongside it, in Overlays and APIs.json, rather than crammed inside an
      OpenAPI.
  - slug: api-days-london-2026-openapi-upgrades
    title: 'OpenAPI Upgrades: The What, the Why and the How'
    time: 10:20am–10:45am
    category: OpenAPI Track
    speakers:
      - lorna-mitchell
    description: >-
      Plenty of teams produced an OpenAPI 3.0 description years ago and have been
      using it ever since; the tooling has moved on, and they haven't. The upgrade
      to 3.1 and beyond is achievable and brings many benefits: proper JSON Schema
      alignment, nullable retired in favour of type arrays, webhooks described
      where they belong, and $ref that plays nicely with a description beside it.
      In this session you'll hear practical tactics for making the jump, what to
      expect along the way, and how to get the best from the tools that have
      appeared while you weren't looking. Find out what your API description
      could be doing for you instead of quietly rotting in a repository.
  - slug: api-days-london-2026-api-security-profiles
    title: The State of Proposals for API Security Profiles in OpenAPI
    time: 10:45am–11:10am
    category: OpenAPI Track
    speakers:
      - chris-wood
    description: >-
      OpenAPI Security Scheme Objects are a point-in-time snapshot of security
      that is increasingly duplicated in dedicated security profiles like FAPI and
      GNAP. OpenAPI needs a way to align more closely with security requirements,
      while also dovetailing with existing approaches like OpenID Discovery, which
      allows clients and agents alike to scaffold code and make runtime decisions
      meaningfully. This session walks through the state of the current proposals
      to enhance the OpenAPI Specification and unlock these capabilities. It will
      describe the proposed additions to OpenAPI, and how they might improve how
      security requirements are represented in OpenAPI in the future. We'll touch
      on the proposal's status and demonstrate meaningful examples showing the
      value of these improvements.
