description: >-
  The OpenAPI Initiative co-organizes the API Standards Conference at API Days
  Paris 2026 with the AsyncAPI Initiative, JSON Schema, and the GraphQL
  Foundation, at the Centre des Nouvelles Industries et Technologies. The
  OpenAPI talks span all three days: OpenAPI in the age of AI, AI-ready API
  metadata, Arazzo workflows for humans and agents, LLMs versus dedicated
  OpenAPI tooling, agent registries, and open standards that connect APIs with
  data.
