# Global speaker registry — the single source of truth for every speaker.
#
# Events reference speakers by `slug` (in event.yaml: the top-level `speakers:`
# list, agenda `speaker:`/`speakers:`, and each talk's `speakers:`). The resolver
# in src/lib/speakers.ts rehydrates a slug into the {name, position, photo} shape
# the UI consumes, where `position` = "role | company".
#
# Identity vs. affiliation: name/image/description are stable identity and live
# here. `company` (and `role` when known) hold each speaker's LATEST-known
# affiliation, reconciled from their most recent per-event override — role and
# company are taken as a matched pair from that same latest event. Point-in-time
# affiliations for any given talk are snapshotted per event via
# data/<year>/<slug>/speakers/speakers.yaml overrides.
#
# `badges` is an optional list of membership pills shown after the speaker's name,
# e.g. `badges: [TSC, OAI]` (TSC = Technical Steering Committee, OAI = OpenAPI
# Initiative member). Codes are uppercased on render; unknown codes still show,
# they just get no tooltip. Like every other field it merges per-event, so an
# event override can pin the badges a speaker held at that event.
#
# `urls` is an optional list of external links, rendered as icons next to the
# speaker in the agenda and talk cards:
#
#   urls:
#     - id: linkedin
#       url: https://www.linkedin.com/in/danciruli/
#       name: My LinkedIn Profile   # optional; overrides the default label
#
# `id` picks the icon (linkedin, github, x — anything else gets a globe) and the
# default accessible label; `url` is used verbatim; `name` overrides the label. A
# single link may be written as one bare mapping instead of a list. A speaker
# with no `urls` simply shows no link icons. Like every other field it merges per
# event, but as a whole list, not entry by entry.
#
# `image` is either a bare filename (-> data/speakers/image/<file>, copied to
# public/img/speakers/<slug>.webp by `npm run speakers`) or a full URL / absolute
# /path (used as-is). Speakers with no image yet resolve to the neutral committed
# avatar /img/_avatar-placeholder.svg (real photos are harvested in a later pass).
#
# Speakers who only appeared at company-less events have no company yet. image is
# still backfilled in a later pass.

