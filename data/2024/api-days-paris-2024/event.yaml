talks:
  - slug: api-days-paris-2024-introduction-to-openapi
    title: 'Introduction to OpenAPI: Understanding and Using OpenAPI in Practice'
    category: Workshops
    speakers:
      - thomas-bayer
    description: >-
      OpenAPI has become essential for the design, documentation, and seamless
      integration of APIs, providing a standardized description language that
      enhances collaboration. This course covers the core principles and
      practical use of OpenAPI, empowering you to explore, create, and integrate
      OpenAPI descriptions confidently in your design, development, management,
      and governance workflows.
  - slug: api-days-paris-2024-designing-apis-openapi
    title: 'Designing APIs with OpenAPI: Build the Right APIs the Right Way'
    category: Workshops
    speakers:
      - mike-amundsen
    description: >-
      In this workshop, join industry expert Mike Amundsen for an in-depth,
      hands-on exploration of API design using the OpenAPI Specification. This
      workshop will cover core principles and modern techniques for designing
      effective, scalable APIs that meet real-world needs. Participants will learn
      how to leverage the OpenAPI Specification to create clear, reusable, and
      maintainable API contracts that drive efficient development and robust
      client-server interactions.
  - slug: api-days-paris-2024-api-delivery-openapi
    title: 'API Delivery with OpenAPI: Enhancing Governance, Workflows, and Developer Experience'
    category: Workshops
    speakers:
      - frank-kilcommins
      - yousaf-nabi
    description: >-
      Join this workshop to explore a collaborative, design-first approach to API
      delivery, using OpenAPI as the single source of truth. Set within a
      financial payments scenario, this session covers everything from defining
      business requirements and infusing API standards awareness through example
      mapping, to ensuring seamless integration and consumer testing for safe API
      evolution. Attendees will learn how OpenAPI and Arazzo can drive
      documentation, virtualization, and contract testing to streamline API
      evolution, enhance governance, and elevate developer and consumer
      experiences.
